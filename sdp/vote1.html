<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electoral Authentication Portal</title>
    <!-- FontAwesome for modern ECI icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Official patriotic background image with a dark overlay for readability */
            background-image: linear-gradient(rgba(10, 25, 47, 0.85), rgba(10, 25, 47, 0.85)), url('https://images.unsplash.com/photo-1532375810709-75b1da00537c?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Official ECI Style Card */
        .eci-card {
            background: #ffffff;
            border-radius: 12px;
            width: 420px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            position: relative;
            border-top: 6px solid #FF9933; /* Saffron */
            border-bottom: 6px solid #138808; /* Green */
        }

        /* Watermark Ashoka Chakra */
        .eci-card::before {
            content: '\f1ce'; /* FontAwesome circle-notch used as abstract chakra */
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 250px;
            color: rgba(0, 0, 128, 0.03); /* Faint Navy Blue */
            z-index: 0;
            pointer-events: none;
        }

        .header {
            background: #f8f9fa;
            padding: 25px 20px;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
            position: relative;
            z-index: 1;
        }

        .header img {
            width: 40px;
            margin-bottom: 10px;
        }

        .header h2 {
            font-size: 22px;
            color: #000080; /* Navy Blue */
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header p {
            font-size: 12px;
            color: #666;
            font-weight: 600;
            margin-top: 5px;
        }

        .form-body {
            padding: 30px;
            position: relative;
            z-index: 1;
        }

        .input-group {
            position: relative;
            margin-bottom: 22px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #333;
            font-weight: 700;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 38px;
            color: #000080;
            font-size: 16px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 1.5px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            color: #333;
            transition: all 0.3s;
            background: #fdfdfd;
        }

        .input-group input:focus {
            border-color: #000080;
            box-shadow: 0 0 8px rgba(0, 0, 128, 0.15);
            outline: none;
            background: #fff;
        }

        /* Unique Authentication Button */
        .auth-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 6px;
            background: linear-gradient(135deg, #000080, #0033a0);
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .auth-btn:hover {
            background: linear-gradient(135deg, #0033a0, #000080);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 128, 0.3);
        }

        /* Results Panel */
        #result-panel {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            animation: slideDown 0.4s ease-out forwards;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .approved {
            background: #eaffea;
            border: 2px solid #138808;
            color: #0d5c05;
        }

        .rejected {
            background: #ffeaea;
            border: 2px solid #d32f2f;
            color: #b71c1c;
        }

        .epic-badge {
            display: block;
            font-family: monospace;
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
            background: #fff;
            padding: 5px;
            border-radius: 4px;
            border: 1px dashed #138808;
        }
    </style>
</head>
<body>

    <div class="eci-card">
        <div class="header">
            <h2>Vote Validator</h2>
            <p>NATIONAL ELECTORAL AUTHENTICATION</p>
        </div>
        
        <div class="form-body">
            <div class="input-group">
                <label>Full Name</label>
                <i class="fa-solid fa-id-card-clip"></i>
                <input type="text" id="name" placeholder="Elector's Name" autocomplete="off">
            </div>

            <div class="input-group">
                <label>Assembly Constituency</label>
                <i class="fa-solid fa-map-location-dot"></i>
                <!-- Added realistic regional constituency placeholder -->
                <input type="text" id="constituency" placeholder="e.g., Chamundeshwari" autocomplete="off">
            </div>

            <div class="input-group" style="display: flex; gap: 15px;">
                <div style="flex: 1;">
                    <label>Age</label>
                    <i class="fa-solid fa-calendar-check" style="left: 15px;"></i>
                    <input type="number" id="age" placeholder="Age" min="1" style="padding-left: 45px;">
                </div>
                <div style="flex: 1.5; position: relative;">
                    <label>Nationality</label>
                    <i class="fa-solid fa-flag" style="left: 15px;"></i>
                    <input type="text" id="nationality" placeholder="Citizenship" autocomplete="off" style="padding-left: 45px;">
                </div>
            </div>

            <button class="auth-btn" onclick="authenticateVoter()">
                <i class="fa-solid fa-fingerprint"></i> Validate Identity
            </button>

            <div id="result-panel">
                <!-- Result dynamically generated here -->
            </div>
        </div>
    </div>

    <script>
        function authenticateVoter() {
            const name = document.getElementById('name').value.trim();
            const constituency = document.getElementById('constituency').value.trim() || 'Unspecified';
            const age = parseInt(document.getElementById('age').value);
            const nationality = document.getElementById('nationality').value.trim().toLowerCase();
            const panel = document.getElementById('result-panel');

            // Reset
            panel.style.display = 'none';
            panel.className = '';
            
            setTimeout(() => {
                panel.style.display = 'block';

                if (!name || isNaN(age) || !nationality) {
                    panel.className = 'rejected';
                    panel.innerHTML = `<i class="fa-solid fa-circle-exclamation fa-2x"></i><br><br><strong>Error:</strong> Mandatory fields missing. Please complete the form.`;
                    return;
                }

                if (age >= 18 && (nationality === 'indian' || nationality === 'india')) {
                    // Generate a fake EPIC/Voter ID number for visual effect
                    const fakeEpic = Math.random().toString(36).substring(2, 5).toUpperCase() + Math.floor(1000000 + Math.random() * 9000000);
                    
                    panel.className = 'approved';
                    panel.innerHTML = `
                        <i class="fa-solid fa-check-double fa-2x"></i><br><br>
                        <strong>AUTHENTICATION SUCCESSFUL</strong><br>
                        Elector <strong>${name}</strong> is fully eligible to cast a ballot in <strong>${constituency}</strong>.<br>
                        <span class="epic-badge">EPIC NO: ${fakeEpic}</span>
                    `;
                } else {
                    panel.className = 'rejected';
                    let reason = (age < 18) ? 'Underage Elector (Must be 18+).' : 'Restricted to Indian citizens.';
                    panel.innerHTML = `
                        <i class="fa-solid fa-ban fa-2x"></i><br><br>
                        <strong>STATUS: INELIGIBLE</strong><br>
                        ${reason}
                    `;
                }
            }, 150);
        }
    </script>

</body>
</html>
